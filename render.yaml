services:
  - type: worker
    name: ai-telegram-bot
    runtime: docker
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Задаётся вручную в панели Render
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BOT_MODE
        value: scheduler
    healthCheckPath: /health
