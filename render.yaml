services:
  - type: web
    name: telegram-news-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHECK_INTERVAL
        value: "1800"
      - key: MAX_NEWS_PER_CYCLE
        value: "5"
      - key: PUBLISH_DELAY
        value: "5"
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
